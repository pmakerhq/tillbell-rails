name: Release

# Publishes the gem to RubyGems when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Needs a GEM_HOST_API_KEY repository secret with the "Push rubygem" scope.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - name: Check that the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/tillbell/version -e 'print Tillbell::VERSION')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match lib/tillbell/version.rb ($version)" >&2
            exit 1
          fi
      - run: bin/rubocop
      - run: bin/rspec
      - run: gem build tillbell.gemspec
      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
        run: gem push tillbell-*.gem
